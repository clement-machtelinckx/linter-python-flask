name: Release to GHCR

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Serialize releases: the registry itself does not enforce immutable tags.
concurrency:
  group: ghcr-release
  cancel-in-progress: false

env:
  # Full reference; bake reads its own bare IMAGE variable from the environment, hence the name.
  IMAGE_REF: ghcr.io/clement-machtelinckx/linter-python-flask
  # Identity of the keyless signature: this workflow, on a SemVer release tag, via GitHub OIDC.
  # No COSIGN_ prefix: Cosign binds every COSIGN_<FLAG> variable to a flag (#38).
  RELEASE_SIGNER_IDENTITY_REGEXP: ^https://github\.com/clement-machtelinckx/linter-python-flask/\.github/workflows/publish_to_ghcr\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
  RELEASE_SIGNER_OIDC_ISSUER: https://token.actions.githubusercontent.com
  SYFT_VERSION: "1.42.0"
  GRYPE_VERSION: "0.108.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Validate SemVer, main commit and successful source workflows
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            if (context.eventName !== 'push' || !context.ref.startsWith('refs/tags/')) {
              throw new Error('Only a tag push may publish');
            }
            const tag = context.ref.slice('refs/tags/'.length);
            // SemVer without build metadata (+ is not allowed in Docker tags).
            const version = tag.match(/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/);
            if (!version || version[0] !== tag || tag.length > 128 || (version[4] && version[4].split('.').some(
              id => /^[0-9]+$/.test(id) && id.length > 1 && id.startsWith('0')))) {
              throw new Error('Invalid release tag: expected vX.Y.Z or vX.Y.Z-prerelease');
            }
            const repo = context.repo;
            const {data: main} = await github.rest.git.getRef({...repo, ref: 'heads/main'});
            const {data: commit} = await github.rest.repos.getCommit({...repo, ref: context.ref});
            const sha = commit.sha;
            if (sha !== context.sha || sha !== main.object.sha) {
              throw new Error('The tag must point to the current main commit');
            }
            for (const [file, requiredJobs] of Object.entries({
              'quality.yml': ['python-quality', 'hadolint'],
              'image-security.yml': ['image-security', 'integration / docker-compose-test']
            })) {
              const {data: workflow} = await github.rest.actions.getWorkflow({...repo, workflow_id: file});
              const {data: runs} = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: workflow.id, branch: 'main', head_sha: sha, per_page: 100
              });
              const run = runs.workflow_runs.find(r =>
                ['push', 'workflow_dispatch'].includes(r.event) && r.head_branch === 'main' &&
                r.head_sha === sha && r.head_repository.full_name === `${repo.owner}/${repo.repo}` &&
                r.workflow_id === workflow.id && r.path === workflow.path);
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error(`Missing successful main run for ${file} at ${sha}`);
              }
              const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
                ...repo, run_id: run.id, filter: 'latest', per_page: 100
              });
              if (requiredJobs.some(name => !jobs.jobs.some(j => j.name === name && j.conclusion === 'success'))) {
                throw new Error(`Missing successful required job in ${file}`);
              }
              core.info(`${workflow.name}: ${run.html_url}`);
            }
            core.setOutput('sha', sha);
            core.setOutput('tag', tag);

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless Cosign signature (Sigstore OIDC)
    defaults:
      run:
        shell: bash
    env:
      COMMIT_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    outputs:
      digest: ${{ steps.bake.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Refuse to overwrite an existing release tag
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          image = os.environ['IMAGE_REF'].removeprefix('ghcr.io/')
          credentials = f"{os.environ['GITHUB_ACTOR']}:{os.environ['GHCR_TOKEN']}".encode()
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': f'repository:{image}:pull'})
          request = urllib.request.Request('https://ghcr.io/token?' + query,
              headers={'Authorization': 'Basic ' + base64.b64encode(credentials).decode()})
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['token']
          request = urllib.request.Request(f"https://ghcr.io/v2/{image}/manifests/{os.environ['RELEASE_TAG']}",
              headers={'Authorization': 'Bearer ' + token,
                       'Accept': 'application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'})
          try:
              urllib.request.urlopen(request, timeout=30).close()
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              codes = {item['code'] for item in json.load(error).get('errors', [])}
              if not codes or not codes <= {'MANIFEST_UNKNOWN', 'NAME_UNKNOWN'}:
                  raise
              print('Release tag is absent; publication is allowed')
          else:
              raise SystemExit('Release tag already exists; refusing to overwrite it')
          PY

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up an isolated BuildKit builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR with GITHUB_TOKEN
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install verified Syft and Grype
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl --proto '=https' --proto-redir '=https' -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "syft_${SYFT_VERSION}_checksums.txt"
          tar -xzf "syft_${SYFT_VERSION}_linux_amd64.tar.gz" syft
          curl --proto '=https' --proto-redir '=https' -fsSLO "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' -fsSLO "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "grype_${GRYPE_VERSION}_checksums.txt"
          tar -xzf "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" grype
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      # Declarative multi-arch build: amd64 + arm64, SemVer + commit tags, registry cache
      # (mode=max), build secret mounted in tmpfs. Bake pushes one OCI index per tag.
      # The Dockerfile requires and format-checks the secret, so the release build gets a
      # throw-away random token (no private index exists); it lives in RUNNER_TEMP only.
      - name: Build and push the multi-arch image with Bake
        id: bake
        env:
          REGISTRY: ghcr.io/clement-machtelinckx
          IMAGE: linter-python-flask
        run: |
          trap 'rm -f "$RUNNER_TEMP/pip_token"' EXIT
          umask 077
          printf 'tok_%s\n' "$(openssl rand -hex 24)" > "$RUNNER_TEMP/pip_token"
          export TAGS="$RELEASE_TAG,sha-${COMMIT_SHA:0:12}"
          docker buildx bake -f docker-bake.hcl --metadata-file "$RUNNER_TEMP/bake-metadata.json" \
            --set "api.secret=id=pip_token,src=$RUNNER_TEMP/pip_token"
          digest=$(jq -r '.api["containerimage.digest"]' "$RUNNER_TEMP/bake-metadata.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Published image: %s@%s\n' "$IMAGE_REF" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prove the unified OCI index (linux/amd64 + linux/arm64)
        env:
          DIGEST: ${{ steps.bake.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF@$DIGEST" --raw > "$RUNNER_TEMP/index.json"
          jq -e '.mediaType == "application/vnd.oci.image.index.v1+json"' "$RUNNER_TEMP/index.json"
          for platform in amd64 arm64; do
            jq -r --arg a "$platform" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' \
              "$RUNNER_TEMP/index.json" | grep -E '^sha256:[0-9a-f]{64}$' > "$RUNNER_TEMP/digest-$platform"
          done
          docker buildx imagetools inspect "$IMAGE_REF@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

      # The pushed image is a fresh build, so each platform manifest is inventoried from the
      # registry and gated by Grype (.grype.yaml, OpenVEX applied) before anything is signed.
      - name: SBOM and Grype gate on every published platform manifest
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          for platform in amd64 arm64; do
            digest=$(cat "$RUNNER_TEMP/digest-$platform")
            syft scan "registry:$IMAGE_REF@$digest" \
              -o "cyclonedx-json=$RUNNER_TEMP/sbom/sbom-$platform.cdx.json" \
              -o "spdx-json=$RUNNER_TEMP/sbom/sbom-$platform.spdx.json"
            grype "sbom:$RUNNER_TEMP/sbom/sbom-$platform.cdx.json" --output table \
              2>&1 | tee "$RUNNER_TEMP/sbom/grype-gate-$platform.txt"
          done

      # Signatures and attestations target immutable digests, never the mutable tag: the index
      # (what users pull) and each platform manifest (what each SBOM really describes).
      # Legacy signature format on purpose: Cosign 3 defaults to Sigstore bundles via the OCI
      # referrers API, which Cosign 2.x verifiers cannot read; the tag-based format is verifiable
      # by both (drop the two flags to migrate once every verifier runs Cosign 3).
      - name: Sign the index and the platform manifests (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.bake.outputs.digest }}
        run: |
          cosign sign --yes --use-signing-config=false --new-bundle-format=false "$IMAGE_REF@$DIGEST"
          for platform in amd64 arm64; do
            cosign sign --yes --use-signing-config=false --new-bundle-format=false "$IMAGE_REF@$(cat "$RUNNER_TEMP/digest-$platform")"
          done

      - name: Attach each platform SBOM to its manifest as a signed attestation
        run: |
          for platform in amd64 arm64; do
            cosign attest --yes --use-signing-config=false --new-bundle-format=false --type cyclonedx --predicate "$RUNNER_TEMP/sbom/sbom-$platform.cdx.json" \
              "$IMAGE_REF@$(cat "$RUNNER_TEMP/digest-$platform")"
          done

      - name: Upload release SBOMs and platform digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom-${{ needs.validate.outputs.tag }}
          path: |
            ${{ runner.temp }}/sbom/
            ${{ runner.temp }}/digest-amd64
            ${{ runner.temp }}/digest-arm64
          retention-days: 90

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io

  # Final admission gate: an independent job verifies, from the registry only, that the
  # published index and both platform manifests are signed by this workflow and that each
  # manifest carries an authentic SBOM attestation whose subject is that very digest.
  admission:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR (read)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve the platform manifests from the registry
        run: |
          docker buildx imagetools inspect "$IMAGE_REF@$DIGEST" --raw > "$RUNNER_TEMP/index.json"
          for platform in amd64 arm64; do
            jq -r --arg a "$platform" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' \
              "$RUNNER_TEMP/index.json" | grep -E '^sha256:[0-9a-f]{64}$' > "$RUNNER_TEMP/digest-$platform"
          done

      - name: Verify the signatures (index and platform manifests)
        run: |
          for ref in "$DIGEST" "$(cat "$RUNNER_TEMP/digest-amd64")" "$(cat "$RUNNER_TEMP/digest-arm64")"; do
            cosign verify --new-bundle-format=false "$IMAGE_REF@$ref" \
              --certificate-identity-regexp "$RELEASE_SIGNER_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$RELEASE_SIGNER_OIDC_ISSUER" \
              --output text
          done

      - name: Verify each SBOM attestation and check it describes its manifest
        run: |
          for platform in amd64 arm64; do
            digest=$(cat "$RUNNER_TEMP/digest-$platform")
            cosign verify-attestation --new-bundle-format=false "$IMAGE_REF@$digest" --type cyclonedx \
              --certificate-identity-regexp "$RELEASE_SIGNER_IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$RELEASE_SIGNER_OIDC_ISSUER" \
              --output json > "$RUNNER_TEMP/attestation-$platform.json"
            jq -r '.payload' "$RUNNER_TEMP/attestation-$platform.json" | base64 -d > "$RUNNER_TEMP/statement-$platform.json"
            jq -e --arg d "${digest#sha256:}" \
              'select(.predicateType == "https://cyclonedx.org/bom") | .subject[] | select(.digest.sha256 == $d)' \
              "$RUNNER_TEMP/statement-$platform.json" > /dev/null
            echo "- $platform: attested SBOM with $(jq '[.predicate.components[] | select(.type != "file")] | length' "$RUNNER_TEMP/statement-$platform.json") packages" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io
