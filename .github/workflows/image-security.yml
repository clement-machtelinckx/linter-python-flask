name: image security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, tp2/buildkit-supply-chain-multiarch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  image-security:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      IMAGE_TAG: flask-security:${{ github.sha }}
      DIVE_VERSION: "0.13.1"
      TRIVY_VERSION: "0.75.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.28.0
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Prepare reports
        run: |
          mkdir -p "$RUNNER_TEMP/image-security"
          (umask 077; openssl rand -hex 32 > "$RUNNER_TEMP/build-token")
          git rev-parse HEAD > "$RUNNER_TEMP/image-security/commit.txt"
          date -u +%FT%TZ > "$RUNNER_TEMP/image-security/time.txt"

      - name: Validate Bake and Dockerfile
        run: |
          docker buildx bake -f docker-bake.hcl --print local arm64 multiarch > "$RUNNER_TEMP/image-security/bake.json"
          docker buildx build --check .

      - name: Build AMD64, ARM64 and local OCI index without publishing
        id: build
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        env:
          BUILD_TOKEN_FILE: ${{ runner.temp }}/build-token
        with:
          files: docker-bake.hcl
          targets: local,arm64,multiarch
          set: |
            local.tags=${{ env.IMAGE_TAG }}
            multiarch.cache-from=type=gha,scope=tp2-multiarch
            multiarch.cache-to=type=gha,scope=tp2-multiarch,mode=max

      - name: Check local index and binary imports on both platforms
        run: |
          python3 scripts/check_multiarch.py security-evidence/image.oci.tar > "$RUNNER_TEMP/image-security/multiarch.json"
          docker run --rm --platform linux/arm64 --entrypoint /usr/bin/python3.13 \
            linter-python-flask-api:arm64 -c 'import flask, psycopg2, os; assert os.getuid() == 65532'
          docker history --no-trunc "$IMAGE_TAG" > "$RUNNER_TEMP/image-security/history.txt"
          python3 scripts/check_secret.py "$RUNNER_TEMP/build-token" \
            security-evidence/image.oci.tar "$RUNNER_TEMP/image-security/history.txt"

      - name: Install verified tools
        id: tools
        run: |
          mkdir -p "$RUNNER_TEMP/image-tools"
          cd "$RUNNER_TEMP/image-tools"
          curl --proto '=https' --proto-redir '=https' -fsSLO "https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/dive_${DIVE_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' -fsSLO "https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/dive_${DIVE_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "dive_${DIVE_VERSION}_checksums.txt"
          tar -xzf "dive_${DIVE_VERSION}_linux_amd64.tar.gz" dive
          curl --proto '=https' --proto-redir '=https' -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --proto '=https' --proto-redir '=https' -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "trivy_${TRIVY_VERSION}_checksums.txt"
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          echo "$RUNNER_TEMP/image-tools" >> "$GITHUB_PATH"
          ./dive --version > "$RUNNER_TEMP/image-security/tools.txt"
          ./trivy --version >> "$RUNNER_TEMP/image-security/tools.txt"

      - name: Dive efficiency gate (at least 80 percent)
        run: |
          CI=true dive "$IMAGE_TAG" --ci-config .dive-ci \
            2>&1 | tee "$RUNNER_TEMP/image-security/dive.txt"

      - name: Trivy full report (including unfixed vulnerabilities)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: |
          trivy image --scanners vuln --format json \
            --output "$RUNNER_TEMP/image-security/trivy-full.json" "$IMAGE_TAG" \
            2>&1 | tee "$RUNNER_TEMP/image-security/trivy-full.log"

      - name: Trivy fixable HIGH and CRITICAL gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "$IMAGE_TAG" \
            2>&1 | tee "$RUNNER_TEMP/image-security/trivy-gate.txt"

      - name: Trivy secret gate without secret values in reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: |
          trivy image --scanners secret --exit-code 1 --format template \
            --template '{{range .}}{{range .Secrets}}{{.RuleID}} at line {{.StartLine}}{{"\n"}}{{end}}{{end}}' \
            "$IMAGE_TAG" > "$RUNNER_TEMP/image-security/trivy-secrets.txt"

      # TASK-012 must load this image after all checks for this SHA have passed.
      - name: Export the validated image for TASK-012
        run: |
          mkdir -p "$RUNNER_TEMP/validated-image"
          docker image save --output "$RUNNER_TEMP/validated-image/image.tar" "$IMAGE_TAG"
          docker image inspect --format '{{.Id}}' "$IMAGE_TAG" > "$RUNNER_TEMP/validated-image/image-id.txt"
          printf '%s\n' "$IMAGE_TAG" > "$RUNNER_TEMP/validated-image/image-tag.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/validated-image/commit.txt"
          cd "$RUNNER_TEMP/validated-image"
          sha256sum image.tar > image.tar.sha256

      - name: Upload validated image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-image-${{ github.sha }}
          path: ${{ runner.temp }}/validated-image/
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload security reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-${{ github.sha }}
          path: ${{ runner.temp }}/image-security/
          retention-days: 7
          overwrite: true

      - name: Remove build simulation token
        if: always()
        run: rm -f "$RUNNER_TEMP/build-token"

  integration:
    needs: image-security
    uses: ./.github/workflows/multi-container.yml
    with:
      image-artifact: validated-image-${{ github.sha }}
