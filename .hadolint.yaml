# Explicit Hadolint policy: the defaults are made visible so a reviewer can see what blocks.
failure-threshold: warning
# Registries the Dockerfile may pull from (DL3026); ghcr.io hosts our own published image.
trustedRegistries:
  - docker.io
  - gcr.io
  - cgr.dev
  - ghcr.io
override:
  # Promoted to error: these break reproducibility or run as root.
  error:
    - DL3002 # last USER must not be root
    - DL3006 # image tag must be explicit
    - DL3007 # never use :latest
    - DL4006 # set -o pipefail before a pipe in RUN
  # Kept at warning: style rules that must not hide a real error.
  warning:
    - DL3025 # JSON notation for CMD/ENTRYPOINT
    - DL3042 # pip --no-cache-dir (superseded by the BuildKit cache mount, kept visible)
