# Trivy custom secret rule used by the build-secret leak gate (image-security.yml).
# The CI build mounts a simulated private-index token of the form tok_<48 hex>; the generic
# Trivy rules do not know that shape, so without this rule a leaked token would go unnoticed.
# The gate runs a positive control (the rule must detect the token on disk) before scanning
# the image, so a clean scan is a real result and not a silent miss.
rules:
  - id: simulated-pip-token
    category: BuildSecret
    title: Simulated private package-index token
    severity: CRITICAL
    regex: 'tok_[0-9a-f]{48}'
